name: Disable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disable-pages.yml'

permissions:
  contents: read
  pages: write

jobs:
  disable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Disable GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o response.json -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          cat response.json || true
          if [ "$code" = "204" ] || [ "$code" = "404" ]; then
            exit 0
          fi
          echo "Unexpected HTTP status: $code"
          exit 1
